name: Build & Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    environment: DOCKERHUB
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version metadata
        id: meta
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "major_minor=$MAJOR.$MINOR" >> $GITHUB_OUTPUT

          {
            echo "brgjr10/zima-ssh-terminal:${TAG_NAME}"
            echo "brgjr10/zima-ssh-terminal:${VERSION}"
            echo "brgjr10/zima-ssh-terminal:${MAJOR}.${MINOR}"
            echo "brgjr10/zima-ssh-terminal:${MAJOR}"
            echo "brgjr10/zima-ssh-terminal:latest"
            echo "ghcr.io/brgjr10/zima-ssh-terminal:${TAG_NAME}"
            echo "ghcr.io/brgjr10/zima-ssh-terminal:${VERSION}"
            echo "ghcr.io/brgjr10/zima-ssh-terminal:${MAJOR}.${MINOR}"
            echo "ghcr.io/brgjr10/zima-ssh-terminal:${MAJOR}"
            echo "ghcr.io/brgjr10/zima-ssh-terminal:latest"
          } > /tmp/docker-tags.txt

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/docker-tags.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=zima-ssh-terminal
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/brgjr10/Zima-MCP
          cache-from: type=gha
          cache-to: type=gha,mode=max
